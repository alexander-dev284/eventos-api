<div class="row g-4">
  
  <!-- FORMULARIO DE REGISTRO -->
  <div class="col-lg-7">
    <div class="card border border-secondary-subtle bg-body-tertiary shadow p-4 h-100">
      <div class="mb-4">
        <h2 class="h5 fw-bold text-white mb-1">Registrar Inscripción Transaccional</h2>
        <p class="text-secondary small m-0">Inscribe a un asistente en uno o múltiples eventos de forma atómica</p>
      </div>
      <form id="registroForm" class="d-flex flex-column gap-3">
        <div class="d-flex flex-column gap-1">
          <label class="form-label text-secondary fw-semibold small m-0" for="regAsistenteSelect">Seleccionar Asistente</label>
          <select id="regAsistenteSelect" class="form-select" required>
            <option value="">-- Seleccione un asistente --</option>
            <!-- Carga dinámica -->
          </select>
        </div>
        
        <div class="d-flex flex-column gap-1">
          <label class="form-label text-secondary fw-semibold small m-0">Eventos Disponibles (Selecciona uno o varios)</label>
          <div class="border border-secondary-subtle bg-dark rounded p-2 overflow-y-auto" id="regEventosCheckboxList" style="max-height: 250px;">
            <!-- Carga dinámica de checkboxes -->
          </div>
        </div>
        
        <button type="submit" class="btn btn-primary w-100 fw-semibold mt-2">Confirmar Inscripción</button>
      </form>
    </div>
  </div>

  <!-- LISTA DE INSCRIPCIONES RECIENTES -->
  <div class="col-lg-5">
    <div class="card border border-secondary-subtle bg-body-tertiary shadow p-4 h-100">
      <div class="mb-4">
        <h2 class="h5 fw-bold text-white mb-1">Registros Realizados</h2>
        <p class="text-secondary small m-0">Historial de inscripciones procesadas en el sistema</p>
      </div>
      <div class="list-container d-flex flex-column gap-3" id="registrosListContainer">
        <!-- Carga dinámica -->
      </div>
    </div>
  </div>

</div>
