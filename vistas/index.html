<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Eventos - Eventify</title>
  <!-- Bootstrap v5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css?v=1.0.3">
</head>
<body class="bg-dark text-light min-vh-screen">

  <!-- LOADING SPINNER -->
  <div id="loadingOverlay" class="loading-overlay position-fixed top-0 start-0 w-100 h-100 bg-dark bg-opacity-75 z-3 d-flex justify-content-center align-items-center hidden">
    <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
      <span class="visually-hidden">Cargando...</span>
    </div>
  </div>

  <!-- TOAST NOTIFICATIONS -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- LOGIN SECTION MOUNT POINT -->
  <div id="loginSection" class="min-vh-screen w-100 d-flex justify-content-center align-items-center p-3">
    <!-- Loaded dynamically from login.html -->
  </div>

  <!-- APP LAYOUT -->
  <div id="appLayout" class="app-layout hidden d-flex min-vh-screen">
    
    <!-- SIDEBAR -->
    <aside class="sidebar bg-body-tertiary border-end border-secondary-subtle d-flex flex-column p-4">
      <div class="d-flex align-items-center gap-2 mb-4">
        <span class="text-primary fs-3 fw-bold">✦</span>
        <span class="fs-5 fw-bold text-white tracking-tight">Eventify</span>
      </div>
      
      <div class="d-flex align-items-center gap-3 p-3 bg-dark bg-opacity-25 border border-secondary-subtle rounded-3 mb-4">
        <div class="avatar bg-primary bg-opacity-10 text-primary border border-primary border-opacity-25 rounded-circle fw-bold d-flex align-items-center justify-content-center" id="userAvatar" style="width: 40px; height: 40px;">U</div>
        <div class="d-flex flex-column overflow-hidden">
          <span class="text-sm fw-semibold text-white truncate" id="profileName">Usuario</span>
          <span class="text-xs text-secondary" id="profileRole">Rol</span>
        </div>
      </div>

      <nav class="sidebar-nav flex-grow-1">
        <ul class="nav flex-column gap-1 p-0">
          <li data-tab="asistentes" id="navAsistentes" class="nav-item d-flex align-items-center gap-3 px-3 py-2.5 rounded-3 text-secondary border border-transparent cursor-pointer">
            <span class="fs-5">👤</span>
            <span>Asistentes</span>
          </li>
          <li data-tab="eventos" id="navEventos" class="nav-item d-flex align-items-center gap-3 px-3 py-2.5 rounded-3 text-secondary border border-transparent cursor-pointer">
            <span class="fs-5">📅</span>
            <span>Eventos</span>
          </li>
          <li data-tab="registros" id="navRegistros" class="nav-item d-flex align-items-center gap-3 px-3 py-2.5 rounded-3 text-secondary border border-transparent cursor-pointer">
            <span class="fs-5">✍️</span>
            <span>Inscripción</span>
          </li>
          <li data-tab="reportes" id="navReportes" class="nav-item d-flex align-items-center gap-3 px-3 py-2.5 rounded-3 text-secondary border border-transparent cursor-pointer">
            <span class="fs-5">📊</span>
            <span>Reportes</span>
          </li>
          <li data-tab="usuarios" id="navUsuarios" class="nav-item d-flex align-items-center gap-3 px-3 py-2.5 rounded-3 text-secondary border border-transparent cursor-pointer">
            <span class="fs-5">👥</span>
            <span>Usuarios</span>
          </li>
          <li data-tab="roles" id="navRoles" class="nav-item d-flex align-items-center gap-3 px-3 py-2.5 rounded-3 text-secondary border border-transparent cursor-pointer">
            <span class="fs-5">🛡️</span>
            <span>Roles</span>
          </li>
        </ul>
      </nav>

      <div class="mt-auto pt-4 border-t border-secondary-subtle">
        <button id="logoutBtn" class="btn btn-outline-secondary w-100 d-flex align-items-center justify-content-center gap-2">
          <span></span> Cerrar Sesión
        </button>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-grow-1 p-5 overflow-y-auto" style="height: 100vh;">
      
      <!-- HEADER -->
      <header class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-secondary-subtle">
        <h1 class="h3 fw-bold text-white tracking-tight m-0" id="viewTitle">Cargando...</h1>
        <span class="text-sm text-secondary" id="currentDateStr">Cargando fecha...</span>
      </header>

      <!-- DYNAMIC TAB CONTENT MOUNT POINT -->
      <div id="tabContent">
        <!-- Loaded dynamically from <tab>.html -->
      </div>

    </main>
  </div>

  <!-- MODAL: ASISTENTE (GLOBAL) -->
  <div id="asistenteModal" class="modal">
    <div class="modal-dialog w-100" style="max-width: 500px;">
      <div class="modal-content border border-secondary-subtle bg-dark">
        <div class="modal-header border-bottom border-secondary-subtle">
          <h5 class="modal-title fw-bold text-white" id="asistenteModalTitle">Crear Asistente</h5>
          <button type="button" class="btn-close close-btn" aria-label="Close"></button>
        </div>
        <form id="asistenteForm">
          <div class="modal-body d-flex flex-column gap-3 p-4">
            <input type="hidden" id="asistenteId">
            <div class="d-flex flex-column gap-1">
              <label class="form-label text-secondary fw-semibold text-sm m-0" for="asiIdentificacion">Cédula / Identificación</label>
              <input class="form-control" type="text" id="asiIdentificacion" required placeholder="ej. 1726354859">
            </div>
            <div class="d-flex flex-column gap-1">
              <label class="form-label text-secondary fw-semibold text-sm m-0" for="asiNombre">Nombre Completo</label>
              <input class="form-control" type="text" id="asiNombre" required placeholder="ej. Juan Pérez">
            </div>
            <div class="d-flex flex-column gap-1">
              <label class="form-label text-secondary fw-semibold text-sm m-0" for="asiEmail">Correo Electrónico</label>
              <input class="form-control" type="email" id="asiEmail" required placeholder="ej. juan.perez@example.com">
            </div>
          </div>
          <div class="modal-footer border-top border-secondary-subtle p-3">
            <button type="button" class="btn btn-outline-secondary btn-secondary close-btn">Cancelar</button>
            <button type="submit" class="btn btn-primary px-4">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- MODAL: EVENTO (GLOBAL) -->
  <div id="eventoModal" class="modal">
    <div class="modal-dialog w-100" style="max-width: 500px;">
      <div class="modal-content border border-secondary-subtle bg-dark">
        <div class="modal-header border-bottom border-secondary-subtle">
          <h5 class="modal-title fw-bold text-white" id="eventoModalTitle">Crear Evento</h5>
          <button type="button" class="btn-close close-btn" aria-label="Close"></button>
        </div>
        <form id="eventoForm">
          <div class="modal-body d-flex flex-column gap-3 p-4">
            <input type="hidden" id="eventoId">
            <div class="d-flex flex-column gap-1">
              <label class="form-label text-secondary fw-semibold text-sm m-0" for="eveNombre">Nombre del Evento</label>
              <input class="form-control" type="text" id="eveNombre" required placeholder="ej. Seminario de Ciberseguridad">
            </div>
            <div class="d-flex flex-column gap-1">
              <label class="form-label text-secondary fw-semibold text-sm m-0" for="eveFechaInicio">Fecha de Inicio</label>
              <input class="form-control" type="datetime-local" id="eveFechaInicio" required>
            </div>
            <div class="d-flex flex-column gap-1">
              <label class="form-label text-secondary fw-semibold text-sm m-0" for="eveCapacidad">Capacidad / Cupo Máximo</label>
              <input class="form-control" type="number" id="eveCapacidad" required min="1" placeholder="ej. 50">
            </div>
            <div class="d-flex flex-column gap-1">
              <label class="form-label text-secondary fw-semibold text-sm m-0" for="eveUbicacion">Ubicación / Aula</label>
              <input class="form-control" type="text" id="eveUbicacion" required placeholder="ej. Auditorio Principal o Aula Virtual">
            </div>
          </div>
          <div class="modal-footer border-top border-secondary-subtle p-3">
            <button type="button" class="btn btn-outline-secondary btn-secondary close-btn">Cancelar</button>
            <button type="submit" class="btn btn-primary px-4">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap v5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="index.js?v=1.0.5"></script>
</body>
</html>
