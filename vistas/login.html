<div class="login-screen d-flex flex-column justify-content-center align-items-center w-100 h-100 p-4">
  <div class="login-brand text-center mb-4">
    <div class="brand-icon mb-3">✦</div>
    <h2 class="h3 fw-bold text-white mb-1">Eventify</h2>
    <p class="text-secondary mb-0">Gestiona eventos, inscripciones y usuarios con una experiencia fluida.</p>
  </div>

  <div class="card login-card border border-secondary-subtle shadow-lg p-4" style="width: 100%; max-width: 460px;">
    <div class="card-body p-4">
      <div class="mb-4">
        <h3 class="h5 fw-semibold text-white mb-2">Iniciar sesión</h3>
        <p class="text-secondary small mb-0">Accede con tu usuario administrador o operador.</p>
      </div>

      <form id="loginForm" class="d-flex flex-column gap-3">
        <div class="form-floating">
          <input class="form-control form-control-lg bg-dark text-white border-secondary" type="text" id="loginUsername" placeholder="Usuario" required autocomplete="username">
          <label for="loginUsername">Usuario</label>
        </div>
        <div class="form-floating">
          <input class="form-control form-control-lg bg-dark text-white border-secondary" type="password" id="loginPassword" placeholder="Contraseña" required autocomplete="current-password">
          <label for="loginPassword">Contraseña</label>
        </div>
        <button type="submit" class="btn btn-primary btn-lg fw-semibold mt-2">Ingresar</button>
      </form>
    </div>
  </div>
</div>
