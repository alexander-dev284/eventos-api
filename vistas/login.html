<div class="card p-5 border border-secondary-subtle bg-body-tertiary shadow" style="width: 100%; max-width: 440px; border-radius: 16px;">
  <div class="text-center mb-4">
    <div class="text-primary fs-1 fw-bold mb-2">✦</div>
    <h2 class="h4 fw-bold text-white mb-1">Bienvenido a Eventify</h2>
    <p class="text-secondary small">Inicia sesión para gestionar eventos y asistentes</p>
  </div>
  <form id="loginForm" class="d-flex flex-column gap-3">
    <div class="d-flex flex-column gap-1">
      <label class="form-label text-secondary fw-semibold small m-0" for="loginUsername">Usuario</label>
      <input class="form-control" type="text" id="loginUsername" placeholder="ej. admin" required autocomplete="username">
    </div>
    <div class="d-flex flex-column gap-1">
      <label class="form-label text-secondary fw-semibold small m-0" for="loginPassword">Contraseña</label>
      <input class="form-control" type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn btn-primary w-100 mt-2 fw-semibold">Ingresar</button>
  </form>
</div>
